<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6da7"/>
      <stop offset="100%" stop-color="#0f3b74"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55c5ef"/>
      <stop offset="100%" stop-color="#0e5ea1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7df92"/>
      <stop offset="100%" stop-color="#f1c54d"/>
    </linearGradient>
    <linearGradient id="green1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fd239"/>
      <stop offset="100%" stop-color="#49a91d"/>
    </linearGradient>
    <linearGradient id="green2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7bc728"/>
      <stop offset="100%" stop-color="#1e9826"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9b540"/>
      <stop offset="100%" stop-color="#ee9d19"/>
    </linearGradient>
    <linearGradient id="textBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a8bd3"/>
      <stop offset="100%" stop-color="#0a4b97"/>
    </linearGradient>
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69c12f"/>
      <stop offset="100%" stop-color="#109120"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowHead" markerWidth="16" markerHeight="16" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f2a329"/>
    </marker>
  </defs>

  <rect width="1400" height="1400" fill="#ffffff"/>

  <!-- icon group -->
  <g transform="translate(0,0)" filter="url(#shadow)">
    <!-- phone -->
    <g transform="translate(470,290) rotate(-8 140 220)">
      <rect x="0" y="0" rx="36" ry="36" width="280" height="470" fill="url(#phoneBlue)"/>
      <rect x="20" y="22" rx="28" ry="28" width="240" height="425" fill="url(#screenBlue)"/>
      <rect x="100" y="18" rx="8" ry="8" width="80" height="14" fill="#e6edf3" opacity="0.95"/>
      <circle cx="240" cy="48" r="8" fill="#d8eef8" opacity="0.9"/>

      <text x="120" y="295"
            font-family="Arial, Helvetica, sans-serif"
            font-style="italic"
            font-weight="700"
            font-size="190"
            fill="url(#gold)"
            stroke="#d49d16"
            stroke-width="3">$</text>
    </g>

    <!-- bars -->
    <g transform="translate(730,500)">
      <rect x="0"   y="110" width="76" height="145" fill="url(#green1)"/>
      <rect x="95"  y="65"  width="76" height="190" fill="url(#green1)"/>
      <rect x="190" y="0"   width="76" height="255" fill="url(#green2)"/>
      <rect x="285" y="45"  width="76" height="210" fill="url(#green2)"/>
      <rect x="380" y="30"  width="76" height="225" fill="url(#orange)"/>
      <rect x="74" y="94" width="18" height="161" fill="#ffffff" opacity="0.85"/>
      <rect x="169" y="49" width="18" height="206" fill="#ffffff" opacity="0.85"/>
      <rect x="264" y="-16" width="18" height="271" fill="#ffffff" opacity="0.85"/>
      <rect x="359" y="29" width="18" height="226" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- blue swoosh -->
    <path d="M415 705
             C430 620, 495 560, 620 555
             C580 590, 565 645, 585 720
             C515 740, 470 735, 415 705 Z"
          fill="#1062ab"/>

    <!-- white inner swoosh -->
    <path d="M475 680
             C590 615, 790 590, 1025 635
             C825 605, 625 625, 500 720
             C475 715, 468 699, 475 680 Z"
          fill="#ffffff"/>

    <!-- orange arrow -->
    <path d="M620 695
             C765 650, 910 585, 1042 482"
          fill="none"
          stroke="#f2a329"
          stroke-width="28"
          stroke-linecap="round"
          marker-end="url(#arrowHead)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(0,0)">
    <text x="250" y="1000"
          font-family="Arial, Helvetica, sans-serif"
          font-size="180"
          font-style="italic"
          font-weight="700"
          fill="url(#textBlue)">Smart</text>
    <text x="695" y="1000"
          font-family="Arial, Helvetica, sans-serif"
          font-size="180"
          font-style="italic"
          font-weight="700"
          fill="url(#textGreen)">Spend</text>
  </g>
</svg>
