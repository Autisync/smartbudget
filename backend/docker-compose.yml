name: smartbudget-prod

services:
  backend:
    container_name: smaartspend-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
      VERIFY_EMAIL_TTL_SECONDS: ${VERIFY_EMAIL_TTL_SECONDS:-86400}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      RESET_PASSWORD_DEEP_LINK_BASE: ${RESET_PASSWORD_DEEP_LINK_BASE:-smartbudget://reset-password}
      VERIFY_EMAIL_DEEP_LINK_BASE: ${VERIFY_EMAIL_DEEP_LINK_BASE:-smartbudget://verify-email}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@smaartspend.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SmartBudget}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).getcode()==200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - backend
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.smaartspend-backend.rule=Host(`smaartspend.com`)
      - traefik.http.routers.smaartspend-backend.entrypoints=websecure
      - traefik.http.routers.smaartspend-backend.tls=true
      - traefik.http.routers.smaartspend-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.smaartspend-backend.service=smaartspend-backend-svc
      - traefik.http.services.smaartspend-backend-svc.loadbalancer.server.port=8000

  postgres:
    container_name: smaartspend-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartbudget}
      POSTGRES_USER: ${POSTGRES_USER:-smartbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smaartspend_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbudget} -d ${POSTGRES_DB:-smartbudget}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: smaartspend-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - smaartspend_redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  smaartspend_postgres_data:
  smaartspend_redis_data:

networks:
  backend:
    name: smaartspend-backend
    driver: bridge
  traefik:
    external: true
    name: traefik
