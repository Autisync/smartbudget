name: Backend Docker Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/docker-test.yml'
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smartbudget-backend:test .

      - name: Run backend container
        run: |
          docker run -d \
            --name smartbudget-backend-container \
            -p 8000:8000 \
            smartbudget-backend:test

      - name: Wait for app startup
        run: sleep 15

      - name: Check running containers
        run: docker ps

      - name: Health check
        run: curl --fail http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs smartbudget-backend-container

      - name: Cleanup
        if: always()
        run: |
          docker stop smartbudget-backend-container || true
          docker rm smartbudget-backend-container || true
