name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --obfuscate + --split-debug-info are REQUIRED for every release build.
      # Without them the compiled binary exposes class names, method names, and
      # internal string literals to anyone who reverse-engineers the APK/IPA.
      # The debug-info directory is uploaded as a separate artifact so stack
      # traces can still be de-obfuscated internally using `flutter symbolize`.
      - name: Build Android APK (obfuscated)
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          flutter build apk \
            --dart-define=EXCHANGE_RATE_API_KEY="$EXCHANGE_RATE_API_KEY" \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/android

      - name: Build Android App Bundle (obfuscated)
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          flutter build appbundle \
            --dart-define=EXCHANGE_RATE_API_KEY="$EXCHANGE_RATE_API_KEY" \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols (for flutter symbolize)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-android
          path: build/debug-info/android

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Get dependencies
        run: flutter pub get

      # Same obfuscation requirement as the Android job above: an unobfuscated
      # release binary exposes class/method names and internal string
      # literals to reverse engineering. This CI runner has no distribution
      # signing certificate, so the build is unsigned (--no-codesign) — it
      # exists to catch iOS-specific build breakage and prove the obfuscated
      # build path works, not to produce something installable. Real
      # TestFlight releases are built and signed locally via
      # scripts/build_release.sh ios (Xcode auto-signing), per RELEASE_BUILD.md.
      - name: Build iOS IPA (obfuscated, unsigned)
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          flutter build ipa \
            --dart-define=EXCHANGE_RATE_API_KEY="$EXCHANGE_RATE_API_KEY" \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/ios \
            --no-codesign

      # Symbol upload needs a Sentry auth token this CI environment may not
      # have configured yet. Skip quietly rather than failing the build when
      # it's absent — the obfuscated build itself is what this job verifies.
      - name: Upload debug symbols to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      # --no-codesign means flutter build ipa produces only the .xcarchive,
      # not an .ipa (codesigning is required to package one) — upload that
      # instead of the empty build/ios/ipa directory.
      #
      # continue-on-error: these two uploads are evidence for later
      # inspection, not the thing this job verifies (the obfuscated build
      # succeeding is). A full GitHub Actions storage quota shouldn't mark a
      # successful build red — that's an account-level storage concern to
      # free up or upgrade, not a code problem.
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: release-ios-archive-unsigned
          path: build/ios/archive/Runner.xcarchive

      - name: Upload debug symbols (for flutter symbolize)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: debug-info-ios
          path: build/debug-info/ios
